<div class="c-theme-toggle" role="radiogroup" aria-label="Tema de la interfaz">
  <button type="button" class="c-theme-toggle__option" data-theme-option="light" role="radio" aria-checked="false">
    {% include "partials/icons/sun.svg" %}<span class="c-theme-toggle__label">Claro</span>
  </button>
  <button type="button" class="c-theme-toggle__option" data-theme-option="dark" role="radio" aria-checked="false">
    {% include "partials/icons/moon.svg" %}<span class="c-theme-toggle__label">Oscuro</span>
  </button>
  <button type="button" class="c-theme-toggle__option" data-theme-option="system" role="radio" aria-checked="true">
    {% include "partials/icons/monitor.svg" %}<span class="c-theme-toggle__label">Sistema</span>
  </button>
</div>
