<div class="c-alert c-alert--error" role="alert" id="error-summary" tabindex="-1">
  {% include "partials/icons/circle-alert.svg" %}
  <div class="l-section" style="gap: var(--space-2);">
    <strong>No se pudo ejecutar la simulación</strong>
    <ul style="list-style: disc; padding-left: var(--space-5);">
      {% for error in errors %}
        <li>{{ error }}</li>
      {% endfor %}
    </ul>
    <p class="t-caption">Revisa los valores del formulario y vuelve a intentarlo. Los datos introducidos se conservan.</p>
  </div>
</div>
